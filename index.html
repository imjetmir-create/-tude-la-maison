<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>École TV</title>
<style>
  :root {
    --bg: #141b2d; --panel: #212a40; --panel2: #2b3552; --text: #f4f1ea; --muted: #a8b1c7;
    --accent: #ffc94a; --focus: #ffc94a; --good: #4cd38a; --bad: #ff7a6b; --blue: #5fd3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "SamsungOne", "Segoe UI", Arial, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 2.5vh; padding: 1.6vh 4vh; font-size: 2.6vh; color: var(--muted); flex: none; }
  .crumbs { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { color: var(--text); font-weight: 700; }
  .sep { opacity: .5; margin: 0 .6vh; }
  .total { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .nav { display: flex; gap: 1.2vh; flex: none; }
  .btn.nav { min-height: 6vh; padding: .8vh 2.4vh; font-size: 2.5vh; margin: 0; background: var(--panel); }
  .main { flex: 1; overflow: hidden; padding: 0 5vh 3vh; position: relative; }

  h1 { font-size: 5.4vh; margin: 0 0 1vh; }
  .sub { font-size: 2.8vh; color: var(--muted); margin-bottom: 2vh; line-height: 1.4; }
  .hint { font-size: 2.1vh; color: var(--muted); margin-top: 2vh; text-align: center; line-height: 1.5; }
  .kicker { font-size: 2.5vh; color: var(--accent); font-weight: 700; margin: 0.5vh 0 1.5vh; }

  /* Éléments sélectionnables à la télécommande */
  .f { cursor: pointer; border: 0.5vh solid transparent; transition: transform .12s, background .12s; }
  .f.focus { border-color: var(--focus) !important; transform: scale(1.04); box-shadow: 0 0 3vh rgba(255, 201, 74, .35); z-index: 2; position: relative; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 1.2vh; background: var(--panel2); border-radius: 1.8vh;
    padding: 1.6vh 3vh; font-size: 2.9vh; font-weight: 700; margin: 0 1vh; min-height: 8vh; }
  .btn.good { background: #1f5a3d; } .btn.bad { background: #6b2a2a; }
  .bar { display: flex; align-items: center; justify-content: flex-end; gap: 1vh; margin-top: 2vh; }
  .bar.center { justify-content: center; }
  .dots { flex: 1; text-align: center; }
  .dot { display: inline-block; width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--panel2); margin: 0 .5vh; }
  .dot.on { background: var(--accent); }

  /* Accueil, cartes */
  .hero { text-align: center; padding-top: 4vh; }
  .hero h1 { font-size: 7vh; }
  .cards { display: flex; justify-content: center; gap: 4vh; margin-top: 3vh; flex-wrap: wrap; }
  .card { background: var(--panel); border-radius: 3vh; padding: 3vh; width: 40vh; text-align: center; }
  .card .av { width: 16vh; height: 16vh; border-radius: 50%; margin: 0 auto 2vh; display: flex; align-items: center; justify-content: center; font-size: 9vh; }
  .card .av.big { background: var(--panel2); }
  .card .pn { font-size: 4vh; font-weight: 800; }
  .card .pc { font-size: 2.6vh; color: var(--muted); margin-top: 1vh; }
  .card.soon { opacity: .55; }

  /* Liste des thèmes */
  .chap { font-size: 3vh; color: var(--accent); margin: 2.5vh 0 1.2vh; }
  .chaprow { display: flex; align-items: center; gap: 2vh; }
  .chaprow .chap { flex: 1; }
  .btn.mini { min-height: 5.6vh; padding: .8vh 2.4vh; font-size: 2.4vh; margin: 1.4vh 0 .4vh; }
  .shead { display: flex; align-items: center; gap: 3vh; margin: .5vh 0 .5vh; }
  .sprog { flex: 1; font-size: 2.6vh; font-weight: 700; color: var(--accent); }
  .pbar { height: 1.6vh; background: var(--panel2); border-radius: 1vh; overflow: hidden; margin-top: .8vh; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 1vh; }
  .pbar.big { height: 2.6vh; width: 60vh; margin: 2vh auto; }
  .btn.final { background: linear-gradient(135deg, #6b4f12, #3a2f66); font-size: 3vh; margin: 0; }
  .btn.final small { display: block; font-size: 2vh; font-weight: 400; color: var(--muted); }
  .tgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.6vh; }
  .tbtn { background: var(--panel); border-radius: 2vh; padding: 1.6vh 2vh; display: flex; align-items: center; gap: 1.6vh; min-height: 10vh; }
  .tbtn .ti { font-size: 4.4vh; }
  .tbtn .tt { flex: 1; font-size: 2.6vh; font-weight: 700; line-height: 1.25; }
  .tbtn .tm { font-size: 2.2vh; white-space: nowrap; }
  .st { color: var(--accent); letter-spacing: .2vh; font-size: 2.6vh; }

  /* Page d'un thème */
  .thead { display: flex; align-items: center; gap: 3vh; margin: 2vh 0 4vh; }
  .thead .ti { font-size: 10vh; }
  .flow { display: flex; gap: 3vh; justify-content: center; }
  .card.step { width: 38vh; position: relative; padding: 4vh 2.5vh; }
  .card.step.next { background: #2d3a5c; }
  .step .num { position: absolute; top: 1.5vh; left: 2vh; font-size: 2.4vh; color: var(--muted); font-weight: 700; }
  .step .fi { font-size: 9vh; }
  .step .fn { font-size: 3.4vh; font-weight: 800; margin: 1.5vh 0 1vh; }
  .step .fd { font-size: 2.3vh; color: var(--muted); }
  .step .done { position: absolute; top: 1.2vh; right: 2vh; color: var(--good); font-size: 3.4vh; font-weight: 800; }

  /* Leçon */
  .slide { background: var(--panel); border-radius: 3vh; padding: 4vh 6vh; min-height: 66vh; }
  .slide h1 { font-size: 5vh; color: var(--accent); }
  .slide .body { font-size: 3.6vh; line-height: 1.55; }
  .slide .body small { display: block; font-size: 2.3vh; color: var(--muted); margin-top: 1vh; }
  .big { font-size: 6.4vh; font-weight: 800; margin: 2.4vh 0; letter-spacing: .1vh; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-weight: 800; line-height: 1.05; margin: 0 .5vh; }
  .frac span:first-child { border-bottom: .4vh solid currentColor; padding: 0 .6vh; }
  .pic { display: inline-block; vertical-align: middle; margin: 1vh 1.5vh; max-width: 100%; }
  .legend { font-size: 2vh; color: var(--muted); margin-top: .6vh; }

  /* Tableaux */
  table.ptab { border-collapse: collapse; margin: 1.5vh 0 .5vh; font-size: 4.2vh; font-weight: 800; }
  .ptab th, .ptab td { border: .3vh solid #56617f; padding: .6vh 2.2vh; text-align: center; }
  .ptab th { font-size: 2.6vh; color: var(--blue); }
  .ptab .u { border-right: .9vh solid var(--accent); }
  table.col { border-collapse: collapse; font-size: 4.6vh; font-weight: 800; font-family: "Courier New", monospace; margin: 1vh 0; }
  .col td { width: 5vh; height: 5.6vh; text-align: center; padding: 0; position: relative; }
  .col tr.carry td { height: 3vh; font-size: 2.6vh; color: var(--bad); }
  .col tr.under td { border-bottom: .5vh solid var(--text); }
  .col tr.res td { color: var(--good); }
  .col td.hl { background: rgba(95, 211, 255, .18); }
  .col sup { font-size: 2.4vh; color: var(--bad); }
  .col s { opacity: .6; }

  /* Exemples, feuille, quiz */
  .excol { display: flex; gap: 3vh; align-items: flex-start; }
  .qcard { background: var(--panel); border-radius: 3vh; padding: 3.5vh 4vh; font-size: 3.6vh; line-height: 1.45; flex: 1; min-height: 40vh; }
  .expl { background: var(--panel); border-radius: 3vh; padding: 2.5vh 3vh; flex: 1.1; font-size: 2.8vh; min-height: 40vh; text-align: left; }
  .expl .sub { margin-top: 3vh; }
  .expl.small { font-size: 2.2vh; padding: 1.5vh 2vh; min-height: 0; margin: 1vh 0 2vh; max-height: 44vh; overflow: hidden; }
  .expl.small table.col { font-size: 3.2vh; } .expl.small .col td { width: 3.6vh; height: 4vh; }
  .expl.small .big { font-size: 4vh; }
  .steps { margin: 1vh 0 0; padding-left: 4vh; line-height: 1.5; }
  .steps li { margin-bottom: .8vh; }
  .vis { text-align: center; }
  .ans { font-size: 3.2vh; margin-top: 2vh; color: var(--good); }
  .clist { display: flex; flex-wrap: wrap; gap: 1vh 3vh; font-size: 3vh; margin-top: 1.5vh; }
  .sgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2vh; }
  .scard { background: var(--panel); border-radius: 2.4vh; padding: 1.6vh 2.4vh 1.6vh 7.4vh; font-size: 2.6vh; line-height: 1.35; position: relative; min-height: 30vh; }
  .scard .sn { position: absolute; top: 1.4vh; left: 1.6vh; background: var(--accent); color: #222; border-radius: 50%; width: 4.4vh; height: 4.4vh;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 2.6vh; }
  .scard .big { font-size: 4.2vh; margin: 1.4vh 0; }
  .scard .pic { width: auto !important; max-width: 100%; height: 19vh !important; margin: 1vh 0 0; }
  .scard .clist { font-size: 2.3vh; }
  .scard .frac { font-size: 2.6vh; }

  .qhead { display: flex; justify-content: space-between; align-items: center; }
  .pdots .pd { display: inline-block; width: 3vh; height: 3vh; border-radius: 50%; background: var(--panel2); margin-left: 1vh; }
  .qprog { display: flex; align-items: center; gap: 2vh; width: 50vh; font-size: 2.6vh; font-weight: 700; color: var(--good); }
  .qprog .pbar { flex: 1; margin: 0; }
  .qtag { font-size: 2.2vh; color: var(--blue); margin-bottom: 1vh; }
  .combo { font-size: 3.2vh; font-weight: 800; color: #ff9d3d; margin: -1vh 0 2vh; animation: pop .5s; }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .pd.on { background: var(--accent); } .pd.ok { background: var(--good); } .pd.ko { background: var(--bad); }
  .quiz { display: flex; gap: 4vh; align-items: flex-start; }
  .quiz .qcard { flex: 1.25; min-height: 70vh; }
  .qside { flex: 1; text-align: center; }
  .input { display: inline-block; min-width: 30vh; margin-top: 2vh; padding: 1.4vh 3vh; border-radius: 2vh; background: #0e1424; border: .5vh solid var(--blue);
    font-size: 6vh; font-weight: 800; text-align: center; }
  .input.ok { border-color: var(--good); color: var(--good); } .input.ko { border-color: var(--bad); color: var(--bad); }
  .input .ph { color: #4b5675; }
  .caret { display: inline-block; width: .5vh; height: 5vh; background: var(--blue); margin-left: .6vh; vertical-align: middle; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .unit { font-size: 4vh; font-weight: 700; margin-left: 2vh; color: var(--muted); }
  .pad { display: grid; grid-template-columns: repeat(3, 13vh); gap: 1.4vh; justify-content: center; margin-bottom: 1.6vh; }
  .btn.key { margin: 0; font-size: 4.4vh; min-height: 10vh; padding: 0; }
  .btn.ok { background: #1f6a45; width: 42vh; font-size: 3.4vh; }
  .choices { display: flex; flex-direction: column; gap: 1.8vh; }
  .btn.choice { justify-content: flex-start; font-size: 3.6vh; margin: 0; min-height: 11vh; padding: 1.4vh 3vh; }
  .kb { display: inline-block; width: 3.4vh; height: 3.4vh; border-radius: .8vh; flex: none; }
  .kb.red { background: #e5484d; } .kb.green { background: #3fbf6f; } .kb.yellow { background: #f5c542; } .kb.blue { background: #3d8bfd; }
  .fb { font-size: 5vh; font-weight: 800; margin: 1vh 0 2vh; }
  .fb.good { color: var(--good); } .fb.bad { color: var(--bad); }
  .score { font-size: 14vh; font-weight: 800; margin: 2vh 0 0; }
  .bigstars .st { font-size: 10vh; letter-spacing: 2vh; }

  /* Français */
  table.conj { border-collapse: collapse; font-size: 3vh; margin: 1vh auto; text-align: left; }
  .conj th { font-size: 2.2vh; color: var(--blue); padding: .4vh 2vh; text-align: left; }
  .conj td { padding: .35vh 2vh; border-top: .2vh solid #3a4563; }
  .duo { display: flex; gap: 4vh; justify-content: center; align-items: flex-start; margin: 1vh 0; }
  .duo > div { font-size: 3vh; line-height: 1.5; }
  .hlw { background: rgba(255, 201, 74, .25); border-bottom: .5vh solid var(--accent); border-radius: .6vh; padding: 0 .6vh; }
  .blank { display: inline-block; min-width: 9vh; border-bottom: .5vh dotted var(--blue); color: var(--blue); text-align: center; }
  .expl.small table.conj { font-size: 2.2vh; } .expl.small .conj td { padding: .1vh 1.4vh; }
  .expl table.conj { font-size: 2.6vh; }
  .steps small { display: block; color: var(--muted); font-size: .85em; }

  /* Allemand */
  .der { color: #5fa8ff; font-weight: 800; } .die { color: #ff6b6b; font-weight: 800; } .das { color: #4cd38a; font-weight: 800; }
  .emo { font-size: 1.3em; }
  .sw { display: inline-block; width: 1.1em; height: 1.1em; border-radius: 50%; border: .3vh solid #fff8; vertical-align: middle; }
  .vgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6vh; margin-top: 1.5vh; }
  .vgrid.small { grid-template-columns: repeat(7, 1fr); }
  .vc { background: var(--panel2); border-radius: 2vh; padding: 1.4vh; text-align: center; font-size: 3vh; line-height: 1.3; }
  .vc .emo { display: block; font-size: 6vh; line-height: 1.2; }
  .vc > span:last-child:not(.emo) { display: block; font-size: 2.3vh; color: var(--muted); }

  /* Carte d'aventure */
  .map { position: relative; margin-top: 1.5vh; border-radius: 3vh; background: linear-gradient(180deg, #1f4a35, #2b5a3a 55%, #335f3b); }
  .map-francais { background: linear-gradient(180deg, #3d2a5c, #4f3470 55%, #5a3b78); }
  .map-allemand { background: linear-gradient(180deg, #5a3a1c, #6b4a22 55%, #7a5526); }
  .map-maths { background: linear-gradient(180deg, #17375e, #1d4677 55%, #245489); }
  .trail { position: absolute; left: 0; top: 0; width: 100%; }
  .deco { position: absolute; font-size: 4.4vh; }
  .mnode { position: absolute; width: 19vh; margin-left: -9.5vh; text-align: center; border-radius: 2vh; padding: .6vh 0; }
  .mnode .mc { width: 11vh; height: 11vh; margin: 0 auto; border-radius: 50%; background: var(--panel2); border: .6vh solid #7d88a8; display: flex; align-items: center;
    justify-content: center; font-size: 5.6vh; box-shadow: 0 .8vh 0 rgba(0, 0, 0, .35); }
  .mnode.done .mc { border-color: var(--good); background: #1f5a3d; }
  .mnode.perfect .mc { border-color: var(--accent); background: #6b5212; }
  .mnode.locked { opacity: .6; } .mnode.locked .mc { font-size: 4.4vh; background: #2a2f3d; }
  .mnode.chest .mc { border-radius: 2.6vh; background: #5a3d1a; border-color: #d9a441; }
  .mnode.chest.open .mc { background: #1f5866; border-color: var(--blue); }
  .mnode .ml { font-size: 1.9vh; font-weight: 700; line-height: 1.2; margin-top: .7vh; max-height: 4.6vh; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-shadow: 0 .2vh .5vh #000; }
  .mnode .st { font-size: 2.2vh; }
  .mnode .me { position: absolute; top: -2.5vh; right: 0; width: 6.6vh; height: 6.6vh; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 3.8vh; border: .4vh solid #fff; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-1.2vh); } }
  .btn.mini.final { margin: 0; }

  /* Défi éclair, badges */
  .card.small { width: 34vh; }
  .subrow { display: flex; justify-content: center; gap: 3vh; margin-top: 4vh; }
  .btn.big2 { font-size: 3.2vh; padding: 1.8vh 4vh; }
  .dhead { display: flex; align-items: center; gap: 4vh; margin-bottom: 2vh; }
  .dscore { font-size: 4.4vh; font-weight: 800; color: var(--accent); white-space: nowrap; }
  .dstreak { color: #ff9d3d; }
  .dtimer { flex: 1; display: flex; align-items: center; gap: 2vh; font-size: 4.4vh; font-weight: 800; }
  .dtimer .pbar { flex: 1; height: 3vh; margin: 0; }
  .dtimer .pbar i { transition: width .2s linear; }
  .dtimer .pbar i.hot { background: var(--bad); }
  .qcard.flash-ok { animation: fok .6s; } @keyframes fok { 0% { background: #1f6a45; } }
  .qcard.flash-ko { animation: fko .6s; } @keyframes fko { 0% { background: #6b2a2a; } }
  .score .pts { font-size: 5vh; color: var(--muted); }
  .newbadge { display: inline-block; background: linear-gradient(135deg, #6b4f12, #3a2f66); border: .4vh solid var(--accent); border-radius: 2vh; padding: 1.4vh 3vh;
    font-size: 3vh; font-weight: 800; margin: 1.5vh auto; animation: pop .6s; max-width: 150vh; line-height: 1.5; white-space: normal; }
  .bgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.6vh; }
  .badge { background: var(--panel); border-radius: 2.2vh; padding: 1.4vh 1vh; text-align: center; }
  .badge .bi { font-size: 5.6vh; line-height: 1.2; }
  .badge .bn { font-size: 2.3vh; font-weight: 800; margin-top: .4vh; }
  .badge .bh { font-size: 1.8vh; color: var(--muted); margin-top: .4vh; }
  .badge.off { opacity: .35; -webkit-filter: grayscale(1); filter: grayscale(1); }

  /* Remettre dans l'ordre */
  .built { display: flex; flex-wrap: wrap; align-items: center; gap: 1vh; margin-top: 3vh; padding: 2vh; border-radius: 2vh; background: #0e1424; border: .5vh solid var(--blue); min-height: 10vh; }
  .built.ok { border-color: var(--good); } .built.ko { border-color: var(--bad); }
  .tile { display: inline-block; background: var(--panel2); border-radius: 1.4vh; padding: .8vh 1.8vh; font-weight: 700; }
  .tile.on { background: #2d4a7a; } .tile.slot { color: #4b5675; background: transparent; border: .3vh dashed #4b5675; }
  .punct, .osep { font-size: 1.2em; font-weight: 800; color: var(--accent); }
  .tiles { display: flex; flex-wrap: wrap; gap: 1vh; margin-top: 1.5vh; }
  .tiles .tile { font-size: .9em; }
  .tilebox { display: flex; flex-wrap: wrap; gap: 1.6vh; justify-content: center; margin-bottom: 1vh; }
  .btn.tilebtn { margin: 0; font-size: 3.2vh; min-height: 8vh; white-space: normal; max-width: 70vh; }

  /* Lecture */
  .texte { background: #f7f1e3; color: #2b2b2b; border-radius: 2vh; padding: 2vh 3vh; font-size: 2.7vh; line-height: 1.5; font-family: Georgia, "Times New Roman", serif; text-align: left; }
  .texte .ttl { font-weight: 800; font-size: 3vh; margin-bottom: .8vh; color: #6b3d12; font-family: "SamsungOne", "Segoe UI", Arial, sans-serif; }
  .qq { margin-top: 2vh; font-weight: 700; }
  .texte p { margin: .7vh 0; }
  .quiz .qcard .texte, .excol .qcard .texte { font-size: 2.3vh; line-height: 1.4; padding: 1.4vh 2.4vh; }
  .quiz .qcard .qq, .excol .qcard .qq { margin-top: 1.4vh; }
  .excol.read .qcard { flex: 1.8; font-size: 2.6vh; padding: 2vh 2.5vh; }
  .excol.read .expl { font-size: 2.4vh; }
  .rcol { display: flex; gap: 2vh; align-items: flex-start; }
  .rtext { flex: .85; } .rtext .texte { font-size: 2.3vh; padding: 1.6vh 2.4vh; }
  .rqs { flex: 1.5; display: flex; flex-wrap: wrap; gap: 1vh; align-content: flex-start; font-size: 2.2vh; line-height: 1.35; }
  .rq { background: var(--panel); border-radius: 1.6vh; padding: .8vh 1.4vh; width: 49%; box-sizing: border-box; }
  .rq .clist { font-size: 1.9vh; gap: .4vh 2vh; margin-top: .6vh; } .rq .qq { margin: 0; display: inline; }
  .rq .tiles { font-size: 2.1vh; }

  /* Confettis */
  .confetti { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i { position: absolute; top: -4vh; width: 1.6vh; height: 2.4vh; border-radius: .3vh; animation: fall 3s linear forwards; }
  @keyframes fall { to { transform: translateY(112vh) rotate(720deg); } }

  #toast { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); background: var(--accent); color: #222; font-size: 3vh; font-weight: 700;
    padding: 2vh 4vh; border-radius: 2vh; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/outils.js?v=9"></script>
<script src="js/maths5.js?v=9"></script>
<script src="js/maths7.js?v=9"></script>
<script src="js/fr-outils.js?v=9"></script>
<script src="js/francais5.js?v=9"></script>
<script src="js/francais7.js?v=9"></script>
<script src="js/de-outils.js?v=9"></script>
<script src="js/allemand5.js?v=9"></script>
<script src="js/allemand7.js?v=9"></script>
